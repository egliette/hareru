<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youtube Dictation</title>
<link rel="icon" href="static/assets/logo.png" type="image/x-icon">
<link rel="stylesheet" type="text/css" href="static/styles.css">
</head>
<body>
  <div class="header">
    <div class="logo-and-name">
      <img class="logo" src="static/assets/logo.png" alt="Logo">
      <h1 class="site-name">YouDict</h1>
    </div>
    <button class="setting-button" onclick="showPopup('setting-popup')">
      <img src="static/assets/setting_icon.svg" alt="Settings Icon">
    </button>
  </div>
  
  <div class="body">
    <div class="video-dictation-container">
      <div class="video-section">
        <div class="url-container">
          <input type="text" id="video-url" placeholder="Enter YouTube Video URL">
          <button onclick="playVideo()" class="play-button">Play Video</button>
        </div>
    
        <div id="video-container"></div>
      </div>
    
      <div class="dictation-section">
    
        <div class="result-container">

          <div class="progress-bar">
            <div class="progress" id="transcript-progress"></div>
            <p id="current-part">0/0</p>
          </div>

          <div class="button-container">
            <button onclick="skipBackward()">Skip Backward</button>
            <button onclick="replay()">Replay [Ctrl]</button>
            <button onclick="skipForward()">Skip Forward</button>
          </div>
          
          <div class="result-paragraph">
            <p id="identical-text"></p>
            <span id="next-word"></span>
            <p id="hidden-words"></p>
          </div>

        </div>
  
    
        <div class="answer-container">
          <textarea id="answer-input"></textarea>
          <div class="answer-button-container">
            <button id="check-answer" onclick="checkAnswer()">Check [Enter]</button>
            <button id="skip-answer" onclick="skipAnswer()">Skip</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="overlay"></div>
  <div class="popup" id="setting-popup">
    <h2 class="title">Setting</h2>
    <p> How would you like to split your dictation video? </p>
    <div class="setting-fields">
      <div class="field" id="paragraphs-option">
        <input type="radio" class="radio-button" name="splitMethod" id="paragraphsMethodRadioButton">
        <input type="number" class="number-input" id="paragraphsPerPart" value="1" min="1">
        <span>paragraphs per part</span>
      </div>
      <div class="field" id="seconds-option">
        <input type="radio" class="radio-button" name="splitMethod" id="secondsMethodRadioButton">
        <input type="number" class="number-input" id="secondsPerPart" value="5" min="1">
        <span class="unselected-color">seconds per part</span>
      </div>
    </div>
    <div class="button-fields">
      <button id="update-button" onclick="updateSetting()">
        Update
      </button>
      <button id="cancel-button" onclick="hidePopup('setting-popup')">
        Cancel
      </button>
    </div>
  </div>

  <script src="static/scripts.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
